[package]
name = "ai-remote-agent"
version = "0.1.0"
edition = "2021"
description = "AI Remote Desktop Control — Agent (runs on target PC)"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.0.13"
enigo = "0.2"
image = "0.25"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
base64 = "0.22"
